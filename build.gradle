plugins {
    id 'java-library'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'com.arivoliacademy'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api 'jakarta.validation:jakarta.validation-api:3.1.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('javadoc') {
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        links 'https://docs.oracle.com/en/java/javase/21/docs/api/'
        addBooleanOption('Xdoclint:none', true)
    }
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

mavenPublishing {
    // Uploads to Sonatype Central Portal (manual Publish click in the website)
    publishToMavenCentral()
    signAllPublications()

    coordinates(group.toString(), 'arivoli-maan-core', version.toString())

    pom {
        name = 'arivoli-maan-core'
        description = 'Lightweight reusable core framework library for Spring Boot applications'
        inceptionYear = '2026'
        url = 'https://github.com/manraj/arivoli-maan-core'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'manraj'
                name = 'Manraj'
                email = 'manraj.govindasamy@gmail.com'
                url = 'https://github.com/manraj'
            }
        }
        scm {
            url = 'https://github.com/manraj/arivoli-maan-core'
            connection = 'scm:git:git://github.com/manraj/arivoli-maan-core.git'
            developerConnection = 'scm:git:ssh://git@github.com/manraj/arivoli-maan-core.git'
        }
    }
}

// vanniktech only auto-wires signingInMemoryKey*; also accept signingKey/signingPassword.
afterEvaluate {
    def key = findProperty('signingInMemoryKey') ?: findProperty('signingKey') ?: System.getenv('ORG_GRADLE_PROJECT_signingInMemoryKey')
    def password = findProperty('signingInMemoryKeyPassword') ?: findProperty('signingPassword') ?: System.getenv('ORG_GRADLE_PROJECT_signingInMemoryKeyPassword')
    if (password == null) {
        password = ''
    }
    if (!key) {
        throw new GradleException(
            "Missing GPG signing key. Set signingInMemoryKey (preferred) or signingKey in ~/.gradle/gradle.properties"
        )
    }
    // Expand literal \n so multi-line ASCII-armored keys work in gradle.properties
    def armored = key.toString().replace('\\n', '\n').replace('\r', '')
    signing {
        useInMemoryPgpKeys(armored, password.toString())
    }
}
