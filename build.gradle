plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'com.arivoliacademy'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api 'jakarta.validation:jakarta.validation-api:3.1.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('javadoc') {
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        links 'https://docs.oracle.com/en/java/javase/21/docs/api/'
        addBooleanOption('Xdoclint:none', true)
    }
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'arivoli-maan-core'
                description = 'Lightweight reusable core framework library for Spring Boot applications'
                url = 'https://github.com/arivoliacademy/arivoli-maan-core'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'arivoliacademy'
                        name = 'Arivoli Academy'
                        email = 'dev@arivoliacademy.com'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/arivoliacademy/arivoli-maan-core.git'
                    developerConnection = 'scm:git:ssh://github.com/arivoliacademy/arivoli-maan-core.git'
                    url = 'https://github.com/arivoliacademy/arivoli-maan-core'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'MavenCentral'
            url = version.endsWith('SNAPSHOT')
                    ? uri('https://central.sonatype.com/repository/maven-snapshots/')
                    : uri('https://central.sonatype.com/repository/maven-releases/')
            credentials {
                username = findProperty('mavenCentralUsername') ?: System.getenv('MAVEN_CENTRAL_USERNAME')
                password = findProperty('mavenCentralPassword') ?: System.getenv('MAVEN_CENTRAL_PASSWORD')
            }
        }
    }
}

signing {
    def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
    def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')

    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.maven
    }
}
